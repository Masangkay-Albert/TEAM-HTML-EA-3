<h2>{{ name() }}</h2>
<img [src]="photoPath()" alt="Photo of Somuelo" width="200">
<button (click)="toggleDescription()">About Me</button>
@if (showDescription()) {
  <p>{{ description() }}</p>
}

<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="example-header-image">
      <img src="assets/somuelo/avatar.jpg" alt="Avatar of Somuelo">
    </div>
    <div class="header-copy">
      <mat-card-title>Alarie Somuelo</mat-card-title>
      <mat-card-subtitle>My Capybara</mat-card-subtitle>
    </div>
  </mat-card-header>
  <img mat-card-image src="assets/somuelo/capybara.jpg" alt="Photo of my capybara">
  <mat-card-content>
    <p>
      This is a photo of my capybara.
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button matButton>LIKE</button>
    <button matButton>SHARE</button>
  </mat-card-actions>
</mat-card>

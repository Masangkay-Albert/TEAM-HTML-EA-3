<h2>{{ name() }}</h2>
<img [src]="photoPath()" alt="Gracy Image" width="200">
<button (click)="toggleDescription()">About Luna</button>
@if (showDescription()) {
  <p>{{ description() }}</p>
}

<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="example-header-image">
      <img src="assets/masangkay/luna/sunnies.jpg" alt="Sunnies Flask Carving Image">
    </div>
    <div class="header-copy">
      <mat-card-title>Gracy Luna</mat-card-title>
      <mat-card-subtitle>Hachiware</mat-card-subtitle>
    </div>
  </mat-card-header>
  <img mat-card-image src="assets/masangkay/luna/hachiware.jpg" alt="Photo of Happy Meal Hachiware">
  <mat-card-content>
    <p>
      This is a photo of Hachiware that I bought from a McDonald’s Happy Meal.
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button matButton>LIKE</button>
    <button matButton>SHARE</button>
  </mat-card-actions>
</mat-card>
